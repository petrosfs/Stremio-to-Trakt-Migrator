<!doctype html>
<html lang="el">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Μεταφορά της βιβλιοθήκης σου από το Stremio στο Trakt.tv. Move your Stremio library to Trakt.tv." />
    <meta name="theme-color" content="#0f172a" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>Stremio to Trakt Migrator</title>
    <script>
      // Apply the saved theme before the first paint (no light flash in dark mode).
      try {
        var t = JSON.parse(localStorage.getItem('theme') || '"system"');
        if (t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches))
          document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
